<!DOCTYPE html>
<html lang="az" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <title>Hive — Profil</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="assets/theme.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body class="min-h-dvh">

  <header class="border-b border-line">
    <div class="mx-auto flex h-16 max-w-3xl items-center justify-between gap-3 px-4 sm:px-6">
      <a href="landingpage.html" class="flex items-center gap-2.5 transition-opacity hover:opacity-95" aria-label="Hive">
        <img src="assets/brand/hive-icon.svg" alt="" class="h-9 w-9 shrink-0 drop-shadow-sm transition-transform duration-200 hover:scale-105" width="36" height="36" />
        <span class="text-xl font-extrabold tracking-tight">Hive</span>
      </a>

      <div class="flex items-center gap-2">
        <select data-lang-select aria-label="Language"
          class="rounded-xl border border-line bg-[var(--c-surface)] px-2.5 py-2 text-xs font-semibold">
          <option value="az">AZ</option>
          <option value="ru">RU</option>
          <option value="tr">TR</option>
          <option value="en">EN</option>
        </select>

        <button type="button" data-theme-toggle data-i18n-aria="nav.theme" aria-pressed="false"
          class="grid h-10 w-10 place-items-center rounded-xl border border-line text-[var(--c-muted)] transition hover:bg-[var(--c-surface-2)]">
          <svg data-icon-sun class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
          <svg data-icon-moon class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-xl px-4 py-10 sm:px-6 sm:py-14">

    <div id="profileLoading" class="space-y-4" aria-busy="true">
      <div class="skeleton h-44 w-full"></div>
      <div class="skeleton h-52 w-full"></div>
    </div>

    <div id="profileError" class="surface hidden p-8 text-center" role="alert">
      <p id="profileErrorText" class="text-sm font-medium"></p>
      <a href="landingpage.html" class="btn btn-outline mt-5 text-xs" data-i18n="auth.back"></a>
    </div>

    <div id="profileContent" class="hidden">
      <div class="surface p-6 text-center">
        <span class="relative mx-auto grid h-16 w-16 place-items-center overflow-hidden rounded-2xl bg-[var(--c-accent)] text-2xl font-bold text-[var(--c-on-accent)]">
          <span id="pubAvatar">?</span>
          <img id="pubAvatarImg" alt="" class="absolute inset-0 hidden h-full w-full object-cover" />
        </span>
        <h1 id="pubFullName" class="mt-4 text-xl font-extrabold tracking-tight">—</h1>
        <div id="pubAbituriyentBadge" class="hidden mt-1.5 inline-flex items-center gap-1.5 rounded-full bg-emerald-500/10 px-3 py-0.5 text-xs font-semibold text-emerald-500 border border-emerald-500/20">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>
          <span>Abituriyent</span>
        </div>
        <p id="pubUsername" class="mt-1 text-sm font-semibold text-accent">—</p>
        <p id="pubUniversity" class="mt-2 text-sm text-muted">—</p>

        <div class="mt-4 flex flex-wrap items-center justify-center gap-2">
          <span id="pubTargetGroup" class="hidden rounded-lg bg-[var(--c-surface-2)] px-2.5 py-1 text-xs font-semibold text-emerald-500"></span>
          <span id="pubSpecialty" class="rounded-lg bg-[var(--c-surface-2)] px-2.5 py-1 text-xs font-semibold"></span>
          <span id="pubFaculty" class="rounded-lg bg-[var(--c-surface-2)] px-2.5 py-1 text-xs font-semibold"></span>
          <span id="pubCourse" class="rounded-lg bg-[var(--c-surface-2)] px-2.5 py-1 text-xs font-semibold"></span>
          <span id="pubGroup" class="rounded-lg bg-[var(--c-surface-2)] px-2.5 py-1 text-xs font-semibold"></span>
        </div>
      </div>

      <form id="anonForm" class="surface mt-5 p-6" novalidate>
        <h2 class="text-base font-semibold" data-i18n="services.2.t"></h2>
        <p class="mt-1 text-xs text-muted" data-i18n="services.2.d"></p>

        <textarea id="anonMessage" rows="4" maxlength="500" class="textarea mt-4"
          aria-describedby="anonError anonCount"></textarea>

        <div class="mt-2 flex items-center justify-between">
          <p id="anonError" class="field-error hidden" role="alert"></p>
          <p id="anonCount" class="ml-auto text-xs tabular-nums text-muted">0/500</p>
        </div>

        <button id="anonSubmit" type="submit" class="btn btn-accent shine mt-4 w-full">
          <svg data-spinner class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" class="opacity-25" />
            <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
          <span data-label data-i18n="contact.form.send"></span>
        </button>
      </form>

      <div id="anonSuccess" class="alert alert-success mt-5 hidden text-center" aria-live="polite">
        <p class="font-semibold" data-i18n="app.notif.new"></p>
        <button id="anonAgain" type="button" class="btn btn-outline mt-3 text-xs" data-i18n="app.direct.send"></button>
      </div>

      <p class="mt-6 text-center text-sm text-muted">
        <span data-i18n="auth.login.noAccount"></span>
        <a href="registerpage.html" class="font-semibold text-accent" data-i18n="nav.signup"></a>
      </p>
    </div>
  </main>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 top-3 z-50 flex flex-col items-center gap-2 px-4" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/i18n.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/pro-features.js"></script>
  <script src="assets/profile.js"></script>
</body>
</html>
