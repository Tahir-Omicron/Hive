<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-label="Hive">
  <defs>
    <linearGradient id="hiveGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="innerH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Futuristic Rounded Hexagon Base -->
  <path d="M24 3.5
           C25.3 3.5 26.5 4.2 27.2 5.4
           L42.5 15.6
           C43.3 16.8 43.8 18.2 43.8 19.6
           L43.8 28.4
           C43.8 29.8 43.3 31.2 42.5 32.4
           L27.2 42.6
           C26.5 43.8 25.3 44.5 24 44.5
           C22.7 44.5 21.5 43.8 20.8 42.6
           L5.5 32.4
           C4.7 31.2 4.2 29.8 4.2 28.4
           L4.2 19.6
           C4.2 18.2 4.7 16.8 5.5 15.6
           L20.8 5.4
           C21.5 4.2 22.7 3.5 24 3.5 Z"
        fill="url(#hiveGlow)" filter="url(#glow)"/>

  <!-- Sleek Modern Glass Inset -->
  <path d="M24 6.2 L39.8 16.8 L39.8 31.2 L24 41.8 L8.2 31.2 L8.2 16.8 Z"
        stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" stroke-linejoin="round" fill="none"/>

  <!-- Stylized Geometric "H" -->
  <rect x="14.5" y="14" width="4.5" height="20" rx="2.25" fill="url(#innerH)"/>
  <rect x="29" y="14" width="4.5" height="20" rx="2.25" fill="url(#innerH)"/>
  <rect x="16.5" y="21.5" width="15" height="5" rx="2.5" fill="url(#innerH)"/>

  <!-- Electric Spark Core -->
  <circle cx="24" cy="24" r="2.2" fill="#F59E0B"/>
</svg>
