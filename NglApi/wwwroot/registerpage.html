<!DOCTYPE html>
<html lang="az" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <title>Hive — Qeydiyyat</title>

  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="assets/theme.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body class="min-h-dvh">

  <header class="border-b border-line">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
      <a href="landingpage.html" class="flex items-center gap-2.5 transition-opacity hover:opacity-95" aria-label="Hive">
        <img src="assets/brand/hive-icon.svg" alt="" class="h-9 w-9 shrink-0 drop-shadow-sm transition-transform duration-200 hover:scale-105" width="36" height="36" />
        <span class="text-xl font-extrabold tracking-tight">Hive</span>
      </a>

      <div class="flex items-center gap-2">
        <select data-lang-select aria-label="Language"
          class="rounded-xl border border-line bg-[var(--c-surface)] px-2.5 py-2 text-xs font-semibold">
          <option value="az">AZ</option>
          <option value="ru">RU</option>
          <option value="tr">TR</option>
          <option value="en">EN</option>
        </select>

        <button type="button" data-theme-toggle data-i18n-aria="nav.theme" aria-pressed="false"
          class="grid h-10 w-10 place-items-center rounded-xl border border-line text-[var(--c-muted)] transition hover:bg-[var(--c-surface-2)]">
          <svg data-icon-sun class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
          <svg data-icon-moon class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="relative mx-auto w-full max-w-2xl px-4 py-12 sm:px-6 sm:py-16">
    <div class="pointer-events-none absolute -top-10 left-1/2 -z-10 h-72 w-72 -translate-x-1/2 rounded-full bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 blur-3xl"></div>

    <div class="surface auth-animated-card border border-line p-6 shadow-xl sm:p-8">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-extrabold tracking-tight" data-i18n="auth.register.title"></h1>
        <span id="roleBadge" class="badge badge-accent">Tələbə Qeydiyyatı</span>
      </div>

      <!-- Hesab Növü: Tələbə və ya Abituriyent -->
      <div class="mt-6 flex rounded-2xl border border-line bg-[var(--c-surface-2)] p-1.5 shadow-inner">
        <button type="button" id="roleBtnStudent" class="flex-1 rounded-xl py-2.5 text-center text-xs font-bold transition-all bg-[var(--c-surface)] text-[var(--c-text)] shadow-sm">
          Universitet Tələbəsi
        </button>
        <button type="button" id="roleBtnAbituriyent" class="flex-1 rounded-xl py-2.5 text-center text-xs font-bold text-muted transition-all hover:text-[var(--c-text)]">
          Abituriyent (İmtahana Hazırlaşan)
        </button>
      </div>

      <form id="registerForm" class="mt-7 space-y-5" novalidate>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="regFirstName" class="mb-1.5 block text-sm font-medium" data-i18n="auth.firstName"></label>
            <input id="regFirstName" type="text" maxlength="50" autocomplete="given-name" class="input" aria-describedby="regFirstNameError" />
            <p id="regFirstNameError" class="field-error hidden" role="alert"></p>
          </div>
          <div>
            <label for="regLastName" class="mb-1.5 block text-sm font-medium" data-i18n="auth.lastName"></label>
            <input id="regLastName" type="text" maxlength="50" autocomplete="family-name" class="input" aria-describedby="regLastNameError" />
            <p id="regLastNameError" class="field-error hidden" role="alert"></p>
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="regUsername" class="mb-1.5 block text-sm font-medium" data-i18n="auth.username"></label>
            <input id="regUsername" type="text" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false"
              class="input" aria-describedby="regUsernameError" />
            <p id="regUsernameError" class="field-error hidden" role="alert"></p>
          </div>
          <div>
            <label for="regEmail" class="mb-1.5 block text-sm font-medium" data-i18n="auth.email"></label>
            <input id="regEmail" type="email" maxlength="150" autocomplete="email" autocapitalize="none" spellcheck="false"
              class="input" aria-describedby="regEmailError" />
            <p id="regEmailError" class="field-error hidden" role="alert"></p>
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="regPassword" class="mb-1.5 block text-sm font-medium" data-i18n="auth.password"></label>
            <div class="relative">
              <input id="regPassword" type="password" maxlength="100" autocomplete="new-password"
                class="input pr-11" aria-describedby="regPasswordError" />
              <button type="button" id="toggleRegPassword" aria-pressed="false" data-i18n-aria="auth.showPassword"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-lg p-2 text-[var(--c-muted)] transition hover:bg-[var(--c-surface-2)]">
                <svg data-eye-show class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg data-eye-hide class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 5.1A10.9 10.9 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2 12s4 7 10 7a10.8 10.8 0 0 0 4.4-.9"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
            <p id="regPasswordError" class="field-error hidden" role="alert"></p>
          </div>
          <div>
            <label for="regAge" class="mb-1.5 block text-sm font-medium" data-i18n="auth.age"></label>
            <input id="regAge" type="number" min="14" max="100" inputmode="numeric" class="input" aria-describedby="regAgeError" />
            <p id="regAgeError" class="field-error hidden" role="alert"></p>
          </div>
        </div>

        <div>
          <label id="labelUniversity" for="regUniversity" class="mb-1.5 block text-sm font-medium" data-i18n="auth.university"></label>
          <div class="relative">
            <input id="regUniversity" type="text" autocomplete="off" spellcheck="false"
              role="combobox" aria-expanded="false" aria-controls="universityList" aria-autocomplete="list"
              class="input pr-9" aria-describedby="regUniversityError" />
            <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[var(--c-muted)]">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <ul id="universityList" role="listbox" aria-label="Universities"
              class="absolute z-20 mt-1 hidden max-h-56 w-full overflow-y-auto rounded-xl border border-line bg-[var(--c-surface)] py-1 shadow-lg"></ul>
          </div>
          <p id="regUniversityError" class="field-error hidden" role="alert"></p>
        </div>

        <!-- Tələbə Rejimi: Fakültə & İxtisas -->
        <div id="rowStudentFaculty" class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="regFaculty" class="mb-1.5 block text-sm font-medium" data-i18n="auth.faculty"></label>
            <input id="regFaculty" type="text" maxlength="120" class="input" aria-describedby="regFacultyError" />
            <p id="regFacultyError" class="field-error hidden" role="alert"></p>
          </div>
          <div>
            <label id="labelSpecialty" for="regSpecialty" class="mb-1.5 block text-sm font-medium" data-i18n="auth.specialty"></label>
            <input id="regSpecialty" type="text" maxlength="120" class="input" aria-describedby="regSpecialtyError" />
            <p id="regSpecialtyError" class="field-error hidden" role="alert"></p>
          </div>
        </div>

        <!-- Tələbə Rejimi: Kurs & Qrup -->
        <div id="rowStudentCourse" class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="regCourse" class="mb-1.5 block text-sm font-medium" data-i18n="auth.course"></label>
            <select id="regCourse" class="select" aria-describedby="regCourseError">
              <option value="" data-i18n="auth.course.placeholder"></option>
              <option value="1" data-i18n="auth.course.1"></option>
              <option value="2" data-i18n="auth.course.2"></option>
              <option value="3" data-i18n="auth.course.3"></option>
              <option value="4" data-i18n="auth.course.4"></option>
              <option value="5" data-i18n="auth.course.5"></option>
            </select>
            <p id="regCourseError" class="field-error hidden" role="alert"></p>
          </div>
          <div>
            <label id="labelGroup" for="regGroup" class="mb-1.5 block text-sm font-medium" data-i18n="auth.group"></label>
            <input id="regGroup" type="text" maxlength="30" placeholder="2453A" class="input" aria-describedby="regGroupError" />
            <p id="regGroupError" class="field-error hidden" role="alert"></p>
          </div>
        </div>

        <!-- Abituriyent Rejimi: Hədəf Qrup & Məktəb/Sinif -->
        <div id="rowAbituriyentFields" class="hidden grid gap-4 sm:grid-cols-2">
          <div>
            <label for="regTargetGroup" class="mb-1.5 block text-sm font-medium">Hədəf İxtisas Qrupu</label>
            <select id="regTargetGroup" class="select">
              <option value="I Qrup">I Qrup (Riyaziyyat, Fizika, İnformatika)</option>
              <option value="II Qrup">II Qrup (Riyaziyyat, Coğrafiya, Tarix)</option>
              <option value="III Qrup">III Qrup (Azərbaycan dili, Tarix, Ədəbiyyat)</option>
              <option value="IV Qrup">IV Qrup (Biologiya, Kimya, Fizika)</option>
              <option value="V Qrup">V Qrup (Qabiliyyət & Xüsusi İxtisaslar)</option>
            </select>
          </div>
          <div>
            <label for="regSchoolGrade" class="mb-1.5 block text-sm font-medium">Sinif / Status</label>
            <select id="regSchoolGrade" class="select">
              <option value="11-ci Sinif">11-ci Sinif (Məzun ili)</option>
              <option value="10-cu Sinif">10-cu Sinif</option>
              <option value="Məzun">Məzun Abituriyent</option>
              <option value="Kollec Tələbəsi">Subbakalavr / Kollec</option>
            </select>
          </div>
        </div>

        <button id="registerSubmit" type="submit" class="btn btn-accent shine w-full">
          <svg data-spinner class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" class="opacity-25" />
            <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
          <span data-label data-i18n="auth.register.submit"></span>
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-muted">
        <span data-i18n="auth.register.hasAccount"></span>
        <a href="loginpage.html" class="font-semibold text-accent" data-i18n="nav.signin"></a>
      </p>
    </div>

    <p class="mt-6 text-center">
      <a href="landingpage.html" class="text-sm font-semibold text-muted transition hover:text-accent" data-i18n="auth.back"></a>
    </p>
  </main>

  <div id="toasts" class="pointer-events-none fixed inset-x-0 top-3 z-50 flex flex-col items-center gap-2 px-4" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="assets/i18n.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/pro-features.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
